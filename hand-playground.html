<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#070811" />
  <title>HAND//DUEL · 双手弹幕对战</title>
  <style>
    :root{color-scheme:dark;--bg:#070811;--ink:#f6f7fb;--muted:#8f96aa;--cyan:#48e7ff;--red:#ff4f7b;--lime:#d5ff48;--panel:rgba(11,13,25,.76)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC",system-ui,sans-serif}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 18% 30%,#153044 0,transparent 35%),radial-gradient(circle at 82% 70%,#40172a 0,transparent 34%),linear-gradient(135deg,#060711,#101224);pointer-events:none}
    #game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
    .scan{position:fixed;inset:0;pointer-events:none;opacity:.15;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px);mix-blend-mode:overlay}
    .top{position:fixed;z-index:5;left:clamp(16px,3vw,42px);right:clamp(16px,3vw,42px);top:clamp(14px,2.5vw,32px);display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(12px,3vw,50px);align-items:start;pointer-events:none}
    .fighter{min-width:0}.fighter.right{text-align:right}.name{display:flex;gap:9px;align-items:center;margin-bottom:8px;font:800 11px/1 ui-monospace,monospace;letter-spacing:.18em}.right .name{justify-content:flex-end}.badge{width:8px;height:8px;border-radius:50%;background:var(--color);box-shadow:0 0 15px var(--color)}
    .bar{height:clamp(13px,1.8vw,20px);padding:3px;border:1px solid #ffffff2e;background:#02030a99;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,8px 100%)}.bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--color),#fff);box-shadow:0 0 18px var(--color);transition:width .22s}.right .bar i{margin-left:auto;background:linear-gradient(90deg,#fff,var(--color))}.hp{margin-top:6px;color:var(--color);font:800 11px/1 ui-monospace,monospace}
    .logo{text-align:center;font:900 clamp(17px,2.3vw,30px)/.8 ui-monospace,monospace;letter-spacing:-.08em}.logo span{display:block;margin-top:10px;color:var(--lime);font:700 8px/1 ui-monospace,monospace;letter-spacing:.2em}
    .bottom{position:fixed;z-index:6;left:clamp(16px,3vw,42px);right:clamp(16px,3vw,42px);bottom:clamp(14px,2.5vw,30px);display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
    .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,.home-link{appearance:none;border:1px solid #ffffff24;border-radius:999px;background:var(--panel);backdrop-filter:blur(18px);color:var(--ink);padding:12px 16px;font:800 12px/1 inherit;cursor:pointer;transition:.18s;text-decoration:none}button:hover,.home-link:hover{transform:translateY(-2px);border-color:var(--lime)}button.primary{color:#101308;background:var(--lime);border-color:var(--lime)}button:disabled{opacity:.42;cursor:not-allowed;transform:none}
    .status{color:var(--muted);font:700 10px/1.4 ui-monospace,monospace;letter-spacing:.04em;max-width:280px}.status b{color:var(--lime)}
    .camera{position:relative;width:clamp(112px,16vw,210px);aspect-ratio:16/10;border:1px solid #ffffff25;border-radius:16px;overflow:hidden;background:#090b14;box-shadow:0 20px 50px #0009;opacity:.15;transition:.35s}.camera.on{opacity:.7}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.camera span{position:absolute;left:9px;top:8px;padding:5px 7px;border-radius:999px;background:#070811c9;color:var(--lime);font:700 8px/1 ui-monospace,monospace;letter-spacing:.1em}
    .intro,.gameover{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:#05060bb8;backdrop-filter:blur(12px);transition:.35s}.intro.hide,.gameover.hide{opacity:0;pointer-events:none}.card{width:min(620px,100%);padding:clamp(24px,5vw,48px);border:1px solid #ffffff24;border-radius:28px;background:linear-gradient(145deg,#121526e8,#090b15ed);box-shadow:0 40px 100px #000c;text-align:center}.eyebrow{color:var(--lime);font:800 10px/1 ui-monospace,monospace;letter-spacing:.2em}.card h1{margin:17px 0 10px;font-size:clamp(42px,8vw,82px);line-height:.83;letter-spacing:-.08em}.card h1 em{color:var(--cyan);font-style:normal}.card p{margin:0 auto 24px;color:var(--muted);max-width:480px;line-height:1.7;font-size:14px}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 24px}.rule{padding:13px 8px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff08;font-size:11px;color:var(--muted)}.rule b{display:block;color:var(--ink);margin-bottom:4px;font-size:13px}.result{color:var(--lime);font:900 clamp(36px,7vw,70px)/.9 inherit;letter-spacing:-.06em;margin:14px 0}.damage{position:fixed;z-index:8;pointer-events:none;font:900 24px/1 ui-monospace,monospace;animation:floatDamage .65s ease-out forwards}@keyframes floatDamage{to{transform:translateY(-70px) scale(1.4);opacity:0}}
    @media(max-width:620px){.top{grid-template-columns:1fr 48px 1fr;gap:8px}.logo{font-size:14px}.logo span{display:none}.name{font-size:9px}.bottom{align-items:flex-end}.camera{width:94px}.status{width:100%;order:-1}.controls{max-width:260px}.rules{grid-template-columns:1fr}.rule{padding:9px}.card{padding:24px}.intro .card p{font-size:12px}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="双手手势对战游戏"></canvas><div class="scan"></div>
  <section class="top">
    <div class="fighter" style="--color:var(--cyan)"><div class="name"><i class="badge"></i>PLAYER // LEFT</div><div class="bar"><i id="hp1bar"></i></div><div class="hp" id="hp1">100 HP</div></div>
    <div class="logo">HAND<br>DUEL<span>GESTURE COMBAT</span></div>
    <div class="fighter right" style="--color:var(--red)"><div class="name">PLAYER // RIGHT<i class="badge"></i></div><div class="bar"><i id="hp2bar"></i></div><div class="hp" id="hp2">100 HP</div></div>
  </section>
  <section class="bottom"><div class="controls"><span class="status" id="status">演示模式 · 开启摄像头加入战斗</span><a class="home-link" href="index.html">← 返回主页</a><button class="primary" id="start">开启双手对战</button><button id="switchCamera" disabled>切换相机</button><button id="reset">重开</button></div><div class="camera" id="camera"><video id="video" autoplay muted playsinline></video><span>LOCAL VISION · 2 HANDS</span></div></section>
  <div class="intro" id="intro"><div class="card"><div class="eyebrow">TWO HANDS · ONE WINNER</div><h1>让双手<br><em>开战</em></h1><p>把两只手同时放进画面。系统按屏幕位置分为左右玩家，手势识别完全在本地浏览器运行。</p><div class="rules"><div class="rule"><b>🤏 捏合</b>向对手发射弹幕</div><div class="rule"><b>🖐️ 张掌挥动</b>释放近战斩击</div><div class="rule"><b>✦ 命中</b>先清空对方血条获胜</div></div><button class="primary" id="enter">进入战场</button></div></div>
  <div class="gameover hide" id="gameover"><div class="card"><div class="eyebrow">MATCH COMPLETE</div><div class="result" id="result">LEFT WINS</div><p id="summary">一场漂亮的手势对决。</p><button class="primary" id="again">再战一局</button></div></div>

  <script type="module">
    const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d'),video=$('#video');
    const COLORS=['#48e7ff','#ff4f7b'],players=[makePlayer(0),makePlayer(1)];
    let w=innerWidth,h=innerHeight,dpr=1,last=performance.now(),handLandmarker,stream,running=false,lastVideo=-1,cameras=[],cameraIndex=0,projectiles=[],slashes=[],sparks=[],ended=false,shake=0;
    function makePlayer(i){return{id:i,x:i?innerWidth*.76:innerWidth*.24,y:innerHeight*.6,tx:i?innerWidth*.76:innerWidth*.24,ty:innerHeight*.6,px:0,py:0,vx:0,vy:0,hp:100,pinch:false,open:false,seen:false,shootCd:0,slashCd:0,charge:0}}
    function resize(){dpr=Math.min(devicePixelRatio,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
    function reset(){ended=false;projectiles=[];slashes=[];sparks=[];players.forEach((p,i)=>Object.assign(p,makePlayer(i)));updateHUD();$('#gameover').classList.add('hide')}$('#reset').onclick=reset;$('#again').onclick=reset;$('#enter').onclick=()=>$('#intro').classList.add('hide');
    function updateHUD(){players.forEach((p,i)=>{$(`#hp${i+1}bar`).style.width=p.hp+'%';$(`#hp${i+1}`).textContent=Math.ceil(p.hp)+' HP'})}
    function shoot(p){if(ended||p.shootCd>0)return;const enemy=players[1-p.id],dx=enemy.x-p.x,dy=enemy.y-p.y,d=Math.hypot(dx,dy)||1;projectiles.push({owner:p.id,x:p.x,y:p.y,vx:dx/d*9,vy:dy/d*9,r:8,life:150});p.shootCd=24;for(let i=0;i<8;i++)spark(p.x,p.y,COLORS[p.id],2)}
    function slash(p){if(ended||p.slashCd>0)return;p.slashCd=65;slashes.push({owner:p.id,x:p.x,y:p.y,angle:Math.atan2(p.vy,p.vx),life:18,max:18,r:34});const e=players[1-p.id];if(Math.hypot(e.x-p.x,e.y-p.y)<Math.min(320,w*.34))damage(e,18,p.x,p.y)}
    function damage(p,amount,x,y){if(ended)return;p.hp=Math.max(0,p.hp-amount);shake=10;for(let i=0;i<22;i++)spark(p.x,p.y,COLORS[p.id],6);showDamage(p.x,p.y,amount,COLORS[p.id]);updateHUD();if(p.hp<=0){ended=true;setTimeout(()=>{$('#result').textContent=`${p.id?'LEFT':'RIGHT'} HAND WINS`;$('#summary').textContent='胜负已定。调整一下手势，再来一局？';$('#gameover').classList.remove('hide')},450)}}
    function showDamage(x,y,n,c){const el=document.createElement('div');el.className='damage';el.style.cssText=`left:${x}px;top:${y}px;color:${c}`;el.textContent='-'+n;document.body.append(el);setTimeout(()=>el.remove(),700)}
    function spark(x,y,c,power=4){const a=Math.random()*Math.PI*2,s=Math.random()*power+1;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*20,c,r:Math.random()*3+1})}
    function roundRect(x,y,ww,hh,r){ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);ctx.fill()}
    function drawArena(t){ctx.clearRect(0,0,w,h);ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82}ctx.strokeStyle='#ffffff0a';ctx.lineWidth=1;const gap=60,ox=(t*.012)%gap;for(let x=-gap+ox;x<w;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=-gap+ox;y<h;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.setLineDash([8,14]);ctx.strokeStyle='#ffffff1b';ctx.beginPath();ctx.moveTo(w/2,100);ctx.lineTo(w/2,h-80);ctx.stroke();ctx.setLineDash([])}
    function drawPlayer(p,t){const c=COLORS[p.id];ctx.save();ctx.translate(p.x,p.y);const aura=ctx.createRadialGradient(0,0,5,0,0,82);aura.addColorStop(0,c+'44');aura.addColorStop(1,'transparent');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,0,82,0,7);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=2;ctx.globalAlpha=p.seen?1:.35;ctx.beginPath();ctx.arc(0,0,25+Math.sin(t*.005)*3,0,7);ctx.stroke();ctx.fillStyle='#090b15';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,p.pinch?9:5,0,7);ctx.fill();ctx.font='800 10px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText(p.open?'SLASH READY':p.pinch?'FIRE':'TRACKING',0,50);ctx.restore()}
    function updateCombat(t){for(const p of players){p.shootCd--;p.slashCd--;p.x+=(p.tx-p.x)*.38;p.y+=(p.ty-p.y)*.38}for(let i=projectiles.length-1;i>=0;i--){const b=projectiles[i];b.x+=b.vx;b.y+=b.vy;b.life--;const e=players[1-b.owner];if(Math.hypot(e.x-b.x,e.y-b.y)<30&&e.seen){damage(e,8,b.x,b.y);projectiles.splice(i,1);continue}if(b.life<0||b.x<0||b.x>w||b.y<0||b.y>h){projectiles.splice(i,1);continue}ctx.strokeStyle=COLORS[b.owner]+'55';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(b.x-b.vx*3,b.y-b.vy*3);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle=COLORS[b.owner];ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}for(let i=slashes.length-1;i>=0;i--){const s=slashes[i],k=1-s.life/s.max;s.life--;s.r+=13;ctx.strokeStyle=COLORS[s.owner];ctx.globalAlpha=s.life/s.max;ctx.lineWidth=12*(1-k)+2;ctx.beginPath();ctx.arc(s.x,s.y,s.r,s.angle-1.15,s.angle+1.15);ctx.stroke();ctx.globalAlpha=1;if(s.life<=0)slashes.splice(i,1)}for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.95;s.vy*=.95;s.life--;ctx.globalAlpha=Math.min(1,s.life/18);ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();ctx.globalAlpha=1;if(s.life<=0)sparks.splice(i,1)}players.forEach(p=>drawPlayer(p,t));ctx.restore()}
    function loop(t){drawArena(t);detectHands();updateCombat(t);last=t;requestAnimationFrame(loop)}requestAnimationFrame(loop);
    function handOpen(lm){const tips=[8,12,16,20],pips=[6,10,14,18];return tips.filter((tip,i)=>Math.hypot(lm[tip].x-lm[0].x,lm[tip].y-lm[0].y)>Math.hypot(lm[pips[i]].x-lm[0].x,lm[pips[i]].y-lm[0].y)).length>=4}
    function detectHands(){if(!running||!handLandmarker||video.readyState<2||video.currentTime===lastVideo)return;lastVideo=video.currentTime;const result=handLandmarker.detectForVideo(video,performance.now()),hands=(result.landmarks||[]).map(lm=>({lm,x:1-lm[9].x})).sort((a,b)=>a.x-b.x);players.forEach(p=>p.seen=false);const assigned=hands.length===1?[[hands[0].x<.5?0:1,hands[0]]]:hands.slice(0,2).map((hand,i)=>[i,hand]);assigned.forEach(([i,hand])=>{const p=players[i],lm=hand.lm,tip=lm[8],thumb=lm[4],wrist=lm[0];p.seen=true;p.tx=(1-tip.x)*w;p.ty=tip.y*h;const wx=(1-wrist.x)*w,wy=wrist.y*h;if(p.px){p.vx=wx-p.px;p.vy=wy-p.py}else{p.vx=0;p.vy=0}p.px=wx;p.py=wy;const pinch=Math.hypot(tip.x-thumb.x,tip.y-thumb.y)<.055,open=handOpen(lm);if(pinch&&!p.pinch)shoot(p);if(open&&Math.hypot(p.vx,p.vy)>38)slash(p);p.pinch=pinch;p.open=open});$('#status').innerHTML=hands.length===2?'<b>双手锁定</b> · 战斗进行中':hands.length===1?'已识别 1 只手 · 请放入另一只':'寻找双手中…'}
    async function openDevice(id){stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:id?{deviceId:{exact:id},width:{ideal:1280},height:{ideal:720}}:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();lastVideo=-1}
    async function refreshCameras(){cameras=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const id=stream?.getVideoTracks()[0]?.getSettings().deviceId;cameraIndex=Math.max(0,cameras.findIndex(d=>d.deviceId===id));$('#switchCamera').disabled=cameras.length<2;$('#switchCamera').textContent=cameras.length>1?`切换相机 ${cameraIndex+1}/${cameras.length}`:'仅一个相机'}
    async function startCamera(){const btn=$('#start');try{btn.disabled=true;$('#status').textContent='正在加载双手识别模型…';if(!handLandmarker){const {HandLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');handLandmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.45})}const saved=localStorage.getItem('duelCamera');await openDevice(saved||undefined).catch(()=>openDevice());await refreshCameras();running=true;$('#camera').classList.add('on');btn.textContent='关闭摄像头';btn.disabled=false;$('#intro').classList.add('hide');reset()}catch(e){console.error(e);btn.disabled=false;btn.textContent='重试开启';$('#status').textContent=location.protocol==='file:'?'当前 file:// 可能禁止摄像头，请使用 localhost 或 HTTPS':'无法开启，请检查权限或相机占用'}}
    function stopCamera(){running=false;stream?.getTracks().forEach(t=>t.stop());stream=null;players.forEach(p=>p.seen=false);$('#camera').classList.remove('on');$('#start').textContent='开启双手对战';$('#switchCamera').disabled=true;$('#status').textContent='摄像头已关闭'}
    $('#start').onclick=()=>running?stopCamera():startCamera();$('#switchCamera').onclick=async()=>{if(cameras.length<2)return;try{$('#switchCamera').disabled=true;cameraIndex=(cameraIndex+1)%cameras.length;await openDevice(cameras[cameraIndex].deviceId);localStorage.setItem('duelCamera',cameras[cameraIndex].deviceId);await refreshCameras()}catch(e){console.error(e);$('#status').textContent='切换失败：相机可能正在被占用';$('#switchCamera').disabled=false}};addEventListener('pagehide',stopCamera);
  </script>
</body>
</html>
